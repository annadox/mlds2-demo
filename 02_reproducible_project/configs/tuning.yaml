# Small searches for the lecture, not claims of globally optimal models.
ridge:
  sampler: grid
  n_trials: 3
  parameters:
    alpha: {kind: categorical, choices: [0.1, 1.0, 10.0]}
random_forest:
  sampler: tpe
  n_trials: 10
  n_startup_trials: 4
  parameters:
    max_depth: {kind: int, low: 3, high: 16}
    min_samples_leaf: {kind: int, low: 1, high: 12}
    max_features: {kind: categorical, choices: [0.6, 1.0]}
  # Include Presenter 1's existing forest as a known comparison configuration.
  enqueue:
    - {max_depth: 10, min_samples_leaf: 3, max_features: 1.0}
